name: Deploy Trigger.dev tasks

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/src/trigger/**'
      - 'apps/api/trigger.config.ts'
      - 'apps/api/prisma/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: cd apps/api && npx prisma generate --schema=prisma/schema
        env:
          DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/placeholder'

      - name: Login to private registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "${{ secrets.BRAINST_REGISTRY_URL }}" -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - name: Deploy to Trigger.dev (prod)
        env:
          TRIGGER_SECRET_KEY: ${{ secrets.TRIGGER_SECRET_KEY }}
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
          TRIGGER_API_URL: ${{ secrets.TRIGGER_API_URL }}
          TRIGGER_PROJECT_ID: ${{ secrets.TRIGGER_PROJECT_ID }}
        run: cd apps/api && npx trigger.dev@latest deploy --env prod --registry ${{ secrets.BRAINST_REGISTRY_URL }} --namespace monitoschedule-triggerdotdev-jayjrv
